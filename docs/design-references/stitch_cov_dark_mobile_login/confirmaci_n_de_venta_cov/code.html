<main class="flex-grow flex flex-col items-center justify-center px-4 md:px-gutter z-10 relative pb-24 md:pb-0">
<!-- Success Animation / Icon -->
<div class="mb-lg relative flex justify-center items-center">
<div class="absolute w-32 h-32 rounded-full bg-[#FF7A8A]/20 blur-xl animate-pulse"></div>
<div class="w-24 h-24 rounded-full border-2 border-[#FF7A8A] flex items-center justify-center bg-[#FF7A8A]/10 shadow-[0_0_30px_rgba(255,122,138,0.3)] z-10">
<span class="material-symbols-outlined text-[#FF7A8A] text-5xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Typography -->
<div class="text-center mb-12">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">¡Venta Registrada!</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md mx-auto">La transacción se completó con éxito.</p>
</div>
<!-- Data Card -->
<div class="glass-card rounded-xl p-md w-full max-w-sm mx-auto mb-12 text-center flex flex-col gap-4">
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Monto Total</p>
<p class="font-headline-xl text-headline-xl text-on-surface font-bold">$1,250.00</p>
</div>
<div class="h-px w-full bg-gradient-to-r from-transparent via-white/10 to-transparent"></div>
<div class="flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[#9d4edd] text-xl">stars</span>
<p class="font-label-md text-label-md text-[#c77dff]">+125 pts generados</p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col w-full max-w-sm mx-auto gap-4">
<button class="bg-[#FF7A8A] text-white font-label-md text-label-md rounded-lg py-4 px-gutter w-full transition-all hover:bg-[#ff8f9c] active:scale-95 btn-primary-glow font-bold">
                Nueva Venta
            </button>
<button class="glass-card text-on-surface font-label-md text-label-md rounded-lg py-4 px-gutter w-full transition-all hover:bg-white/5 active:scale-95">
