<body class="antialiased min-h-screen relative pb-32 md:pb-0 pt-20">

</div>
<button class="absolute bottom-0 right-0 bg-surface-variant border border-outline/30 rounded-full p-2 hover:bg-surface-bright transition-colors shadow-lg">
<span class="material-symbols-outlined text-on-surface text-sm" style="font-variation-settings: 'FILL' 0;">edit</span>
</button>
</div>
<p class="font-label-md text-label-md text-on-surface-variant">Tap to change picture</p>
</section>
<!-- Personal Info Form -->
<section class="glass-panel rounded-xl p-md flex flex-col gap-md">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-xs border-b border-white/10 pb-2">Personal Information</h2>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="input-field w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:ring-0" id="fullName" type="text" value="Alex Vance">
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="input-field w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:ring-0" id="email" type="email" value="alex.vance@cov.system">
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="phone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-variation-settings: 'FILL' 0;">call</span>
<input class="input-field w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:ring-0" id="phone" type="tel" value="+1 (555) 019-2834">
</div>
</div>
</section>
<!-- Security Section -->
<section class="glass-panel rounded-xl p-md flex flex-col gap-md mb-xl">
<h2 class="font-headline-sm text-headline-sm text-on-surface mb-xs border-b border-white/10 pb-2">Security</h2>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="currentPassword">Current Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="input-field w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:ring-0" id="currentPassword" placeholder="••••••••" type="password">
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="newPassword">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50" style="font-variation-settings: 'FILL' 0;">key</span>
<input class="input-field w-full rounded-lg py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface focus:ring-0" id="newPassword" placeholder="Enter new password" type="password">
</div>
</div>
</section>

<div class="fixed bottom-0 left-0 w-full p-sm md:p-md bg-gradient-to-t from-black via-black/90 to-transparent z-40 flex justify-center pb-24 md:pb-md">
