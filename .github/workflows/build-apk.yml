name: Build APK (Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/cov-upload.jks
            echo "Keystore restaurado desde secreto."
          else
            echo "::warning::Sin KEYSTORE_BASE64. El APK se firmará con la llave de debug (no apta para Play Store)."
          fi

      # Las claves de cliente de Firebase son públicas (identificadores de la app,
      # no secretos) y ya vienen como valores por defecto en firebase_options.dart.
      # Aquí solo se inyecta el entorno. Si necesitas apuntar a otro proyecto de
      # Firebase, agrega --dart-define=FIREBASE_PROJECT_ID=... en build_command.
      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_ENV=production
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_FILE: cov-upload.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cov-app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14