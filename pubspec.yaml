name: stitch_cov_dark_mobile_login
description: "COV — Control de Ventas e Inventario. App multiplataforma (Web y Android)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  google_sign_in: 6.2.1
  google_fonts: ^6.1.0
  provider: ^6.1.1
  package_info_plus: ^10.2.1
  url_launcher: ^6.2.5
  easy_localization: ^3.0.3

  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  share_plus: ^13.3.0
  mobile_scanner: ^7.4.0
  fl_chart: ^1.2.0
  permission_handler: ^12.0.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.0
  introduction_screen: ^3.1.6
  http: ^1.2.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/screen.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/images/screen.png"
  adaptive_icon_background: "#000000"

flutter_native_splash:
  color: "#000000"
  image: assets/images/screen.png
  android: true
  ios: true