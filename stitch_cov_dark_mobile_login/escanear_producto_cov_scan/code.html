<style>body {
    background-color: #000;
    color: #e5e2e1;
    overscroll-behavior: none
    }
.glass-panel {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.1)
    }
.glass-panel-elevated {
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(32px);
    -webkit-backdrop-filter: blur(32px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 122, 138, 0.05)
    }
.scanner-frame {
    position: relative;
    width: 250px;
    height: 250px
    }
.scanner-frame::before, .scanner-frame::after {
    content: "";
    position: absolute;
    width: 40px;
    height: 40px;
    border-color: #FF7A8A;
    border-style: solid
    }
.scanner-frame::before {
    top: 0;
    left: 0;
    border-width: 3px 0 0 3px;
    border-top-left-radius: 12px
    }
.scanner-frame::after {
    bottom: 0;
    right: 0;
    border-width: 0 3px 3px 0;
    border-bottom-right-radius: 12px
    }
.scanner-frame-tr {
    position: absolute;
    top: 0;
    right: 0;
    width: 40px;
    height: 40px;
    border-color: #FF7A8A;
    border-style: solid;
    border-width: 3px 3px 0 0;
    border-top-right-radius: 12px
    }
.scanner-frame-bl {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 40px;
    height: 40px;
    border-color: #FF7A8A;
    border-style: solid;
    border-width: 0 0 3px 3px;
    border-bottom-left-radius: 12px
    }
.scan-line {
    position: absolute;
    width: 100%;
    height: 2px;
    background: #FF7A8A;
    box-shadow: 0 0 8px 2px rgba(255, 122, 138, 0.6);
    top: 0;
    left: 0;
    animation: scan 2.5s infinite linear
    }
@keyframes scan {
    0% {
        top: 0%;
        opacity: 0;
        } 10% {
        opacity: 1;
        } 90% {
        opacity: 1;
        } 100% {
        top: 100%;
        opacity: 0;
        }
    }
/* Camera feed simulation */
.camera-feed {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCkpmz_iKVleWGCpdCHNPNAqfOzTi1BtWzqgEm7jIIiUOzruh_haBXO6yn2hGnQ46ljwkNWx4SURWiMLGatr5I_GSVAv7LyaJPT5nPGtP1fCBUPqBF5eH7-kkUPoUta2r5iBu-lBHU-b7-dl-nCVWp79jE_53AjhOdcJF187A4A0QrD94-0LlRJfYeej6BlGR65v4SLqlFZmftTr8AYDvIN9qhf3Vi1_eez-P3apfrrmpK2wEk5lydwt6WMGAS1Gc8FPCooICDOm-g);
    background-size: cover;
    background-position: center;
    filter: brightness(0.6) contrast(1.2)
    }
.glow-button {
    transition: all 0.2s ease
    }
.glow-button:active {
    box-shadow: inset 0 0 15px rgba(255, 122, 138, 0.4);
    transform: scale(0.95)
    }</style>
