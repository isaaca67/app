<!-- Desktop Side Nav / Top Nav cluster (Hidden on mobile) -->
<!-- Incorporating the desktop navigation items into a hidden-on-mobile block, though the prompt asked for TopAppBar/BottomNavBar. We'll rely on the BottomNavBar for the primary semantic mapping, but provide a desktop equivalent visually on the right side of TopAppBar if we wanted a true responsive layout. For this strict adherence, we'll follow the JSON which implies TopAppBar handles the top row, BottomNavBar handles mobile bottom row. -->
<script>
        // Set dynamic Spanish date
        document.addEventListener('DOMContentLoaded', () => {
            const dateElement = document.getElementById('current-date');
            if (dateElement) {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                const today = new Date();
                let dateString = today.toLocaleDateString('es-ES', options);
                // Capitalize first letter
                dateString = dateString.charAt(0).toUpperCase() + dateString.slice(1);
                dateElement.textContent = dateString;
            }
        });
    </script>
